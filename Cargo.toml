[workspace]
members = ["crates/mediasim", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
# The single source of the version, for the CLI and the GUI alike: crates/gui/tauri.conf.json omits `version` so Tauri
# inherits it from here. CI stamps the pushed tag into it before building a release.
version = "26.10.0"
# Kept in sync with `edition` in rustfmt.toml.
edition = "2024"
authors = ["Vinicius Egidio"]
license = "Apache-2.0"
repository = "https://github.com/vegidio/mediasim"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
ctrlc = "3.5"
image = "0.25.10"
# Only `Timestamp` and its RFC 3339 `Display` are used, so the time zone database is left out.
jiff = { version = "0.2", default-features = false, features = ["std"] }
media = { package = "media-rs", git = "https://github.com/vegidio/media-rs", tag = "26.10.0" }
ratatui = "0.30"
rayon = "1"
rust-sak = { git = "https://github.com/vegidio/rust-sak", tag = "26.10.2", features = ["fs", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Development builds decode, resample and encode media at a usable speed. At Cargo's default `opt-level = 0`, a
# thumbnail of a 1440×3098 PNG took 0.95s to render, against 0.02s released.
#
# Two entries: `package."*"` covers the dependencies, where the codecs and the resampler live. `profile.dev` itself
# reaches generic code such as `rust_sak::image::encode_writer`, which is monomorphized into this workspace's crates
# and compiled at their level. The cost is one full rebuild of the dependency tree the first time, and a debugger
# that steps less faithfully through the workspace's own crates.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
