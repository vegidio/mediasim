[workspace]
members = ["crates/mediasim", "crates/cli"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
image = "0.25.10"
# No tags published yet; switch to a tag once one exists.
media = { package = "media-rs", git = "https://github.com/vegidio/media-rs", rev = "a0a579152b8421c183f215c67cf97d7e90fcea49" }
ratatui = "0.30"
rayon = "1"
rust-sak = { git = "https://github.com/vegidio/rust-sak", tag = "26.10.2", features = ["fs", "image"] }
thiserror = "2"
