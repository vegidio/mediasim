[package]
name = "mediasim"
version = "0.1.0"
edition = "2024"

[features]
# Makes `Media` and `MediaType` serializable, for front ends that print or send media as data.
serde = ["dep:serde", "dep:jiff"]
# Adds `DirCache` and `Media::from_files_cached`, which keep a directory's decoded media on disk so a restarted load
# resumes where the last one stopped.
cache = ["rust-sak/memo", "dep:serde"]
# Adds `Media::stub`, a file-free constructor for front ends' unit tests. Not part of the supported API.
test-support = []

[dependencies]
image.workspace = true
jiff = { workspace = true, optional = true }
media.workspace = true
rayon.workspace = true
rust-sak.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
