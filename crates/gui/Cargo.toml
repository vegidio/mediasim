[package]
name = "gui"
version = "0.1.0"
edition = "2024"
description = "Tauri 2 desktop application for MediaSim"

[lib]
# The `_lib` suffix avoids a name clash with the bin target, mainly on Windows.
name = "gui_lib"
crate-type = ["lib"]

# Named explicitly so Cargo itself emits `MediaSim[.exe]`. Must match `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "MediaSim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mediasim = { path = "../mediasim", features = ["serde"] }
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
thiserror.workspace = true

[dev-dependencies]
# `mk_temp_dir` fixtures for the set tests in src/set.rs.
rust-sak.workspace = true
serde_json.workspace = true
# `tauri::test::mock_builder`, for the window tests in src/window.rs.
tauri = { version = "2", features = ["test"] }
