[package]
name = "gui"
version = "0.1.0"
edition = "2024"
description = "Tauri 2 desktop application for MediaSim"

[lib]
# The `_lib` suffix avoids a name clash with the bin target, mainly on Windows.
name = "gui_lib"
crate-type = ["lib"]

# Named explicitly so Cargo itself emits `MediaSim[.exe]`. Must match `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "MediaSim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `DynamicImage`, which a preview is rendered to and the `thumb` scheme encodes. Already in the build through
# `mediasim`, at the same version.
image.workspace = true
# `cache` for `DirCache`'s flush settings, which the thumbnail cache shares.
mediasim = { path = "../mediasim", features = ["serde", "cache"] }
# A video's preview frame, extracted at the thumbnail's size by `Resolution::Fit`.
media.workspace = true
# Scores the pairs inside each group in parallel, on the pool the grouper uses. Already in the build through
# `mediasim`, at the same version.
rayon.workspace = true
# `memo` is the thumbnail cache and `crypto` the XXH3-64 behind an admitted file's identity.
rust-sak = { workspace = true, features = ["memo", "crypto"] }
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# `open_path` and `reveal_item_in_dir`, called from Rust by `open.rs`; the plugin itself and its JS API are not used.
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
# `tauri::test::mock_builder`, for the window tests in src/window.rs.
tauri = { version = "2", features = ["test"] }
