[package]
name = "gui"
version.workspace = true
edition.workspace = true
description = "Tauri 2 desktop application for MediaSim"

[lib]
# The `_lib` suffix avoids a name clash with the bin target, mainly on Windows.
name = "gui_lib"
crate-type = ["lib"]

# Named explicitly so Cargo itself emits `MediaSim[.exe]`. Must match `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "MediaSim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `DynamicImage`, which a preview is rendered to and the `thumb` scheme encodes. Already in the build through
# `mediasim`, at the same version.
image.workspace = true
# `cache` for `DirCache`'s flush settings, which the thumbnail cache shares.
mediasim = { path = "../mediasim", features = ["serde", "cache"] }
# A video's preview frame, extracted at the thumbnail's size by `Resolution::Fit`.
media.workspace = true
# Scores the pairs inside each group in parallel, on the pool the grouper uses, and renders thumbnails on a pool of
# their own. Already in the build through `mediasim`, at the same version.
rayon.workspace = true
# `memo` is the thumbnail cache, `memo-async` lets a thumbnail request wait for it without holding a thread, and
# `crypto` is the XXH3-64 behind an admitted file's identity.
rust-sak = { workspace = true, features = ["memo", "memo-async", "crypto"] }
serde.workspace = true
# Serializes cached thumbnails' and video segments' bytes in one piece rather than one element at a time.
serde_bytes = "0.11.19"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# `open_path` and `reveal_item_in_dir`, called from Rust by `open.rs`; the plugin itself and its JS API are not used.
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
thiserror.workspace = true
# `oneshot`, which hands a native picker's answer from its callback to the command awaiting it. Already in the build
# through `tauri`, with the `sync` feature.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json.workspace = true
# `tauri::test::mock_builder`, for the window tests in src/window.rs.
tauri = { version = "2", features = ["test"] }
